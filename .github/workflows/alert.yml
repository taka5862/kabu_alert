name: kabudragon-alert

on:
  schedule:
    # UTC時刻で指定（JST = UTC+9）。21:15 JST = 12:15 UTC。平日のみ（月〜金）
    - cron: "15 12 * * 1-5"
  # 手動で今すぐ実行したいときに「Run workflow」ボタンから実行できるようにする
  workflow_dispatch:

jobs:
  run-alert:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # docs/results.json をリポジトリに書き戻すために必要
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: Pythonをセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 必要なライブラリをインストール
        run: pip install -r requirements.txt

      - name: アラートスクリプトを実行
        env:
          JQUANTS_API_KEY: ${{ secrets.JQUANTS_API_KEY }}
        run: python 03_alert_kabudragon.py

      - name: 結果をリポジトリに保存（Webページに反映）
        run: |
          git config user.name "kabudragon-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/results.json
          git diff --quiet --cached || git commit -m "update results.json"
          git push

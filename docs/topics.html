<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>話題株・ストップ高安まとめ</title>
<style>
  :root {
    --bg: #f5f6f8;
    --card-bg: #ffffff;
    --text: #1c1f26;
    --muted: #9ca3af;
    --accent: #d81b60;
    --accent2: #2563eb;
    --border: #e5e7eb;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  header {
    padding: 12px 16px 8px;
    background: var(--card-bg);
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    z-index: 10;
  }
  header h1 {
    font-size: 16px;
    margin: 0 0 8px;
  }
  .back-link {
    display: inline-block;
    font-size: 13px;
    color: var(--accent);
    text-decoration: none;
    margin-bottom: 8px;
  }
  #tabs {
    display: flex;
    gap: 8px;
  }
  .tab-btn {
    flex: 1;
    padding: 8px 0;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);
    font-size: 13px;
    cursor: pointer;
  }
  .tab-btn.active.a { background: var(--text); border-color: var(--text); color: #fff; }
  .tab-btn.active.digest { background: var(--accent); border-color: var(--accent); color: #fff; }
  .tab-btn.active.stop { background: var(--accent2); border-color: var(--accent2); color: #fff; }

  main {
    padding: 10px 16px 40px;
    max-width: 560px;
    margin: 0 auto;
  }
  .item {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-left: 4px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
    margin-bottom: 8px;
  }
  .item.digest { border-left-color: var(--accent); }
  .item.stop { border-left-color: var(--accent2); }
  .item a {
    color: var(--text);
    text-decoration: none;
    font-size: 14px;
    line-height: 1.4;
  }
  .item .kind {
    display: inline-block;
    font-size: 11px;
    font-weight: bold;
    border-radius: 4px;
    padding: 1px 6px;
    margin-right: 6px;
  }
  .item.digest .kind { color: var(--accent); background: #fbe4ec; }
  .item.stop .kind { color: var(--accent2); background: #e3ecfd; }
  #status {
    color: var(--muted);
    font-size: 13px;
    padding: 20px 0;
  }
</style>
</head>
<body>

<header>
  <a class="back-link" href="index.html">← 株価ページに戻る</a>
  <h1>📰 話題株・ストップ高安まとめ（株探）</h1>
  <div id="tabs">
    <button class="tab-btn active a" data-filter="all">すべて</button>
    <button class="tab-btn digest" data-filter="話題株ダイジェスト">話題株ダイジェスト</button>
    <button class="tab-btn stop" data-filter="ストップ高／安 引け">S高／S安 引け</button>
  </div>
</header>

<main>
  <div id="status">読み込み中...</div>
  <div id="list"></div>
</main>

<script>
let ITEMS = [];
let currentFilter = "all";

function kindClass(kind) {
  return kind === "話題株ダイジェスト" ? "digest" : "stop";
}

function render() {
  const list = document.getElementById("list");
  list.innerHTML = "";
  const filtered = currentFilter === "all" ? ITEMS : ITEMS.filter((i) => i.kind === currentFilter);

  if (filtered.length === 0) {
    document.getElementById("status").textContent = "該当記事がありません。";
    return;
  }
  document.getElementById("status").textContent = "";

  filtered.forEach((item) => {
    const div = document.createElement("div");
    div.className = "item " + kindClass(item.kind);
    const a = document.createElement("a");
    a.href = item.url;
    a.target = "_blank";
    a.rel = "noopener";
    a.innerHTML = `<span class="kind">${item.kind}</span>${item.title}`;
    div.appendChild(a);
    list.appendChild(div);
  });
}

document.querySelectorAll(".tab-btn").forEach((btn) => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".tab-btn").forEach((b) => b.classList.remove("active"));
    btn.classList.add("active");
    currentFilter = btn.dataset.filter;
    render();
  });
});

fetch("topics.json?_=" + Date.now())
  .then((res) => {
    if (!res.ok) throw new Error("topics.json の読み込みに失敗しました");
    return res.json();
  })
  .then((items) => {
    ITEMS = items;
    if (items.length === 0) {
      document.getElementById("status").textContent = "まだデータがありません。";
      return;
    }
    render();
  })
  .catch((err) => {
    document.getElementById("status").textContent = "エラー: " + err.message;
  });
</script>

</body>
</html>

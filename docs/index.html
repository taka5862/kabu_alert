<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>株ドラゴン アラート結果</title>
<style>
  :root {
    --bg: #f5f6f8;
    --card-bg: #ffffff;
    --text: #1c1f26;
    --muted: #9ca3af;
    --accent: #d81b60;
    --accent-soft: #fbe4ec;
    --border: #e5e7eb;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  header {
    padding: 16px 16px 4px;
    background: var(--card-bg);
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    z-index: 10;
  }
  header h1 {
    font-size: 18px;
    margin: 0 0 12px;
  }
  main {
    padding: 12px 16px 40px;
    max-width: 480px;
    margin: 0 auto;
  }

  /* ---- カレンダー ---- */
  .cal-nav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 8px;
  }
  .cal-nav button {
    border: none;
    background: none;
    font-size: 20px;
    color: var(--accent);
    padding: 4px 10px;
    cursor: pointer;
  }
  .cal-nav button:disabled {
    color: var(--muted);
    cursor: default;
  }
  .cal-month-label {
    font-size: 15px;
    font-weight: bold;
  }
  .cal-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 4px;
    margin-bottom: 6px;
  }
  .cal-weekday {
    text-align: center;
    font-size: 11px;
    color: var(--muted);
    padding: 2px 0;
  }
  .cal-day {
    aspect-ratio: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 8px;
    font-size: 13px;
    border: none;
    background: none;
    color: var(--muted);
  }
  .cal-day.has-data {
    background: var(--accent-soft);
    color: var(--text);
    font-weight: bold;
    cursor: pointer;
  }
  .cal-day.selected {
    background: var(--accent);
    color: #fff;
  }
  .cal-day.empty-cell {
    visibility: hidden;
  }

  /* ---- 結果カード ---- */
  .selected-date-label {
    font-size: 13px;
    color: var(--muted);
    margin: 16px 0 8px;
  }
  .section {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px 16px;
    margin-bottom: 14px;
  }
  .section h2 {
    font-size: 15px;
    margin: 0 0 10px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .count-badge {
    font-size: 12px;
    background: var(--bg);
    color: var(--muted);
    border-radius: 10px;
    padding: 2px 8px;
    font-weight: normal;
  }
  .stock-list {
    list-style: none;
    margin: 0;
    padding: 0;
  }
  .stock-list li {
    padding: 8px 0;
    border-top: 1px solid var(--border);
  }
  .stock-list li:first-child { border-top: none; }
  .stock-list a {
    color: var(--text);
    text-decoration: none;
    font-size: 14px;
  }
  .stock-code {
    color: var(--accent);
    font-weight: bold;
    margin-right: 6px;
  }
  .empty {
    color: var(--muted);
    font-size: 13px;
    padding: 4px 0;
  }
  #status {
    color: var(--muted);
    font-size: 13px;
    padding: 20px 0;
  }
</style>
</head>
<body>

<header>
  <h1>📈 株ドラゴン アラート結果</h1>
</header>

<main>
  <div class="cal-nav">
    <button id="prevMonth">‹</button>
    <span class="cal-month-label" id="monthLabel"></span>
    <button id="nextMonth">›</button>
  </div>
  <div class="cal-grid" id="calWeekdays"></div>
  <div class="cal-grid" id="calDays"></div>

  <div id="status">読み込み中...</div>
  <div id="content"></div>
</main>

<script>
const CATEGORY_LABELS = {
  A: "年初来高値 × ストップ高",
  B: "出来高急増 × ストップ高",
  C: "IPO銘柄 × ストップ高",
  D: "出来高急増 × 上ひげ陽線（ヒゲ10%以上）",
  E: "2営業日連続ストップ高",
};
const CATEGORY_ORDER = ["A", "B", "C", "D", "E"];
const WEEKDAYS = ["日", "月", "火", "水", "木", "金", "土"];

let RESULTS = {};
let AVAILABLE_DATES = []; // ISO文字列の配列（データがある日）
let selectedDate = null;
let calYear, calMonth; // カレンダーが今表示している年月（0-indexed月）

function chartUrl(code) {
  return `https://kabutan.jp/stock/chart?code=${encodeURIComponent(code)}`;
}

function formatDateLabel(isoDate) {
  const d = new Date(isoDate + "T00:00:00+09:00");
  return `${d.getMonth() + 1}/${d.getDate()}(${WEEKDAYS[d.getDay()]})`;
}

function renderDay(dateKey) {
  const dayData = RESULTS[dateKey];
  const content = document.getElementById("content");
  const status = document.getElementById("status");
  status.textContent = "";
  content.innerHTML = "";

  const label = document.createElement("div");
  label.className = "selected-date-label";
  label.textContent = formatDateLabel(dateKey) + " の結果";
  content.appendChild(label);

  CATEGORY_ORDER.forEach((key) => {
    const stocks = dayData[key] || [];
    const section = document.createElement("div");
    section.className = "section";

    const h2 = document.createElement("h2");
    h2.innerHTML = `${CATEGORY_LABELS[key]} <span class="count-badge">${stocks.length}件</span>`;
    section.appendChild(h2);

    if (stocks.length === 0) {
      const empty = document.createElement("div");
      empty.className = "empty";
      empty.textContent = "該当銘柄なし";
      section.appendChild(empty);
    } else {
      const ul = document.createElement("ul");
      ul.className = "stock-list";
      stocks.forEach((s) => {
        const li = document.createElement("li");
        const a = document.createElement("a");
        a.href = chartUrl(s.code);
        a.target = "_blank";
        a.rel = "noopener";
        a.innerHTML = `<span class="stock-code">${s.code}</span>${s.name}`;
        li.appendChild(a);
        ul.appendChild(li);
      });
      section.appendChild(ul);
    }
    content.appendChild(section);
  });
}

function selectDate(dateKey) {
  selectedDate = dateKey;
  renderCalendarDays();
  renderDay(dateKey);
}

function renderWeekdayHeader() {
  const el = document.getElementById("calWeekdays");
  el.innerHTML = "";
  WEEKDAYS.forEach((w) => {
    const div = document.createElement("div");
    div.className = "cal-weekday";
    div.textContent = w;
    el.appendChild(div);
  });
}

function renderCalendarDays() {
  const el = document.getElementById("calDays");
  el.innerHTML = "";

  document.getElementById("monthLabel").textContent = `${calYear}年 ${calMonth + 1}月`;

  const firstDay = new Date(calYear, calMonth, 1);
  const startOffset = firstDay.getDay(); // 0=日
  const daysInMonth = new Date(calYear, calMonth + 1, 0).getDate();

  for (let i = 0; i < startOffset; i++) {
    const empty = document.createElement("div");
    empty.className = "cal-day empty-cell";
    el.appendChild(empty);
  }

  for (let day = 1; day <= daysInMonth; day++) {
    const iso = `${calYear}-${String(calMonth + 1).padStart(2, "0")}-${String(day).padStart(2, "0")}`;
    const btn = document.createElement("button");
    btn.className = "cal-day";
    btn.textContent = day;

    if (AVAILABLE_DATES.includes(iso)) {
      btn.classList.add("has-data");
      btn.addEventListener("click", () => selectDate(iso));
    }
    if (iso === selectedDate) {
      btn.classList.add("selected");
    }
    el.appendChild(btn);
  }

  // 前後の月にデータがあるかどうかで、矢印ボタンの有効/無効を切り替える
  const prevBtn = document.getElementById("prevMonth");
  const nextBtn = document.getElementById("nextMonth");
  const hasEarlier = AVAILABLE_DATES.some((d) => d < `${calYear}-${String(calMonth + 1).padStart(2, "0")}-01`);
  const hasLater = AVAILABLE_DATES.some((d) => d > `${calYear}-${String(calMonth + 1).padStart(2, "0")}-31`);
  prevBtn.disabled = !hasEarlier;
  nextBtn.disabled = !hasLater;
}

function changeMonth(diff) {
  calMonth += diff;
  if (calMonth < 0) { calMonth = 11; calYear -= 1; }
  if (calMonth > 11) { calMonth = 0; calYear += 1; }
  renderCalendarDays();
}

document.getElementById("prevMonth").addEventListener("click", () => changeMonth(-1));
document.getElementById("nextMonth").addEventListener("click", () => changeMonth(1));

fetch("results.json?_=" + Date.now())
  .then((res) => {
    if (!res.ok) throw new Error("results.json の読み込みに失敗しました");
    return res.json();
  })
  .then((results) => {
    RESULTS = results;
    AVAILABLE_DATES = Object.keys(results).sort();
    if (AVAILABLE_DATES.length === 0) {
      document.getElementById("status").textContent = "まだデータがありません。";
      renderWeekdayHeader();
      const today = new Date();
      calYear = today.getFullYear();
      calMonth = today.getMonth();
      renderCalendarDays();
      return;
    }
    const latest = AVAILABLE_DATES[AVAILABLE_DATES.length - 1];
    const latestDate = new Date(latest + "T00:00:00+09:00");
    calYear = latestDate.getFullYear();
    calMonth = latestDate.getMonth();

    renderWeekdayHeader();
    renderCalendarDays();
    selectDate(latest);
  })
  .catch((err) => {
    document.getElementById("status").textContent = "エラー: " + err.message;
  });
</script>

</body>
</html>

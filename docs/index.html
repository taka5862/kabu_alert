<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>株ドラゴン アラート結果</title>
<style>
  :root {
    --bg: #f5f6f8;
    --card-bg: #ffffff;
    --text: #1c1f26;
    --muted: #9ca3af;
    --accent: #d81b60;
    --accent-soft: #fbe4ec;
    --border: #e5e7eb;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  header {
    padding: 10px 16px 2px;
    background: var(--card-bg);
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    z-index: 10;
  }
  header h1 {
    font-size: 16px;
    margin: 0 0 8px;
  }
  main {
    padding: 8px 16px 40px;
    max-width: 720px;
    margin: 0 auto;
  }

  /* ---- 2カラムレイアウト ---- */
  .columns {
    display: flex;
    gap: 10px;
    align-items: flex-start;
  }
  .col {
    flex: 1;
    min-width: 0;
  }
  .col-left {
    flex: 0 0 42%;
  }
  .col-right {
    flex: 1;
  }

  /* ---- カレンダー ---- */
  .cal-nav {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 16px;
    margin-bottom: 2px;
  }
  .cal-nav button {
    border: none;
    background: none;
    font-size: 15px;
    color: var(--accent);
    padding: 0 6px;
    cursor: pointer;
    line-height: 1.4;
  }
  .cal-nav button:disabled {
    color: var(--border);
    cursor: default;
  }
  .cal-month-label {
    font-size: 12px;
    font-weight: bold;
    min-width: 80px;
    text-align: center;
  }
  .cal-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 1px;
    margin: 0 auto 2px;
    max-width: 240px;
  }
  .cal-weekday {
    text-align: center;
    font-size: 9px;
    color: var(--muted);
    padding: 0 0 1px;
    line-height: 1.2;
  }
  .cal-day {
    height: 24px;
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 5px;
    font-size: 11px;
    line-height: 1;
    border: none;
    background: none;
    color: var(--muted);
    padding: 0;
  }
  .cal-day.has-data {
    background: var(--accent-soft);
    color: var(--text);
    font-weight: bold;
    cursor: pointer;
  }
  .cal-day.selected {
    background: var(--accent);
    color: #fff;
  }
  .cal-day.empty-cell {
    visibility: hidden;
  }

  /* ---- 結果カード ---- */
  .selected-date-label {
    font-size: 13px;
    color: var(--muted);
    margin: 8px 0 6px;
  }
  .section {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 12px;
    margin-bottom: 8px;
  }
  .section h2 {
    font-size: 13px;
    margin: 0 0 6px;
    display: flex;
    align-items: center;
    gap: 4px;
    flex-wrap: wrap;
  }
  .count-badge {
    font-size: 11px;
    background: var(--bg);
    color: var(--muted);
    border-radius: 10px;
    padding: 1px 7px;
    font-weight: normal;
  }
  .stock-list {
    list-style: none;
    margin: 0;
    padding: 0;
  }
  .stock-list li {
    padding: 3px 0;
  }
  .stock-list a {
    color: var(--text);
    text-decoration: none;
    font-size: 13px;
    line-height: 1.3;
    display: block;
  }
  .stock-code {
    color: var(--accent);
    font-weight: bold;
    margin-right: 4px;
  }
  .stock-cap {
    color: var(--muted);
    font-size: 11px;
    margin-left: 2px;
  }
  .empty {
    color: var(--muted);
    font-size: 13px;
    padding: 2px 0;
  }
  #status {
    color: var(--muted);
    font-size: 13px;
    padding: 8px 0;
  }
</style>
</head>
<body>

<header>
  <h1>📈 株ドラゴン アラート結果 <a href="impact.html" style="font-size:12px; color:#d81b60;">決算インパクト記事 →</a></h1>
</header>

<main>
  <div class="cal-nav">
    <button id="prevMonth">‹</button>
    <span class="cal-month-label" id="monthLabel"></span>
    <button id="nextMonth">›</button>
  </div>
  <div class="cal-grid" id="calWeekdays"></div>
  <div class="cal-grid" id="calDays"></div>

  <div id="status">読み込み中...</div>
  <div id="content"></div>
</main>

<script>
const CATEGORY_LABELS = {
  A: "ストップ高",
  B: "2営業日連続ストップ高",
  C: "年初来高値 × ストップ高",
  D: "出来高急増 × ストップ高",
  E: "IPO銘柄 × ストップ高",
  F: "出来高急増 × 上ひげ陽線（ヒゲ10%以上）",
};
const LEFT_COLUMN = ["A", "B"];
const RIGHT_COLUMN = ["C", "D", "E", "F"];
const WEEKDAYS = ["日", "月", "火", "水", "木", "金", "土"];

let RESULTS = {};
let AVAILABLE_DATES = []; // ISO文字列の配列（データがある日）
let selectedDate = null;
let calYear, calMonth; // カレンダーが今表示している年月（0-indexed月）

function chartUrl(code) {
  return `https://kabutan.jp/stock/chart?code=${encodeURIComponent(code)}`;
}

function truncateName(name, maxLen = 7) {
  if (!name) return "";
  return name.length > maxLen ? name.slice(0, maxLen) + "…" : name;
}

function formatDateLabel(isoDate) {
  const d = new Date(isoDate + "T00:00:00+09:00");
  return `${d.getMonth() + 1}/${d.getDate()}(${WEEKDAYS[d.getDay()]})`;
}

function buildSection(key, dayData) {
  const stocks = dayData[key] || [];
  const section = document.createElement("div");
  section.className = "section";

  const h2 = document.createElement("h2");
  h2.innerHTML = `${CATEGORY_LABELS[key]} <span class="count-badge">${stocks.length}件</span>`;
  section.appendChild(h2);

  if (stocks.length === 0) {
    const empty = document.createElement("div");
    empty.className = "empty";
    empty.textContent = "該当銘柄なし";
    section.appendChild(empty);
  } else {
    const ul = document.createElement("ul");
    ul.className = "stock-list";
    stocks.forEach((s) => {
      const li = document.createElement("li");
      const a = document.createElement("a");
      a.href = chartUrl(s.code);
      a.target = "_blank";
      a.rel = "noopener";
      a.innerHTML = `<span class="stock-code">${s.code}</span>${truncateName(s.name)}${s.cap ? ` <span class="stock-cap">${s.cap}</span>` : ""}`;
      li.appendChild(a);
      ul.appendChild(li);
    });
    section.appendChild(ul);
  }
  return section;
}

function renderDay(dateKey) {
  const dayData = RESULTS[dateKey];
  const content = document.getElementById("content");
  const status = document.getElementById("status");
  status.textContent = "";
  content.innerHTML = "";

  const label = document.createElement("div");
  label.className = "selected-date-label";
  label.textContent = formatDateLabel(dateKey) + " の結果";
  content.appendChild(label);

  const columns = document.createElement("div");
  columns.className = "columns";

  const leftCol = document.createElement("div");
  leftCol.className = "col col-left";
  LEFT_COLUMN.forEach((key) => leftCol.appendChild(buildSection(key, dayData)));

  const rightCol = document.createElement("div");
  rightCol.className = "col col-right";
  RIGHT_COLUMN.forEach((key) => rightCol.appendChild(buildSection(key, dayData)));

  columns.appendChild(leftCol);
  columns.appendChild(rightCol);
  content.appendChild(columns);
}

function selectDate(dateKey) {
  selectedDate = dateKey;
  renderCalendarDays();
  renderDay(dateKey);
}

function renderWeekdayHeader() {
  const el = document.getElementById("calWeekdays");
  el.innerHTML = "";
  WEEKDAYS.forEach((w) => {
    const div = document.createElement("div");
    div.className = "cal-weekday";
    div.textContent = w;
    el.appendChild(div);
  });
}

function renderCalendarDays() {
  const el = document.getElementById("calDays");
  el.innerHTML = "";

  document.getElementById("monthLabel").textContent = `${calYear}年 ${calMonth + 1}月`;

  const firstDay = new Date(calYear, calMonth, 1);
  const startOffset = firstDay.getDay(); // 0=日
  const daysInMonth = new Date(calYear, calMonth + 1, 0).getDate();

  for (let i = 0; i < startOffset; i++) {
    const empty = document.createElement("div");
    empty.className = "cal-day empty-cell";
    el.appendChild(empty);
  }

  for (let day = 1; day <= daysInMonth; day++) {
    const iso = `${calYear}-${String(calMonth + 1).padStart(2, "0")}-${String(day).padStart(2, "0")}`;
    const btn = document.createElement("button");
    btn.className = "cal-day";
    btn.textContent = day;

    if (AVAILABLE_DATES.includes(iso)) {
      btn.classList.add("has-data");
      btn.addEventListener("click", () => selectDate(iso));
    }
    if (iso === selectedDate) {
      btn.classList.add("selected");
    }
    el.appendChild(btn);
  }

  // 前後の月にデータがあるかどうかで、矢印ボタンの有効/無効を切り替える
  const prevBtn = document.getElementById("prevMonth");
  const nextBtn = document.getElementById("nextMonth");
  const hasEarlier = AVAILABLE_DATES.some((d) => d < `${calYear}-${String(calMonth + 1).padStart(2, "0")}-01`);
  const hasLater = AVAILABLE_DATES.some((d) => d > `${calYear}-${String(calMonth + 1).padStart(2, "0")}-31`);
  prevBtn.disabled = !hasEarlier;
  nextBtn.disabled = !hasLater;
}

function changeMonth(diff) {
  calMonth += diff;
  if (calMonth < 0) { calMonth = 11; calYear -= 1; }
  if (calMonth > 11) { calMonth = 0; calYear += 1; }
  renderCalendarDays();
}

document.getElementById("prevMonth").addEventListener("click", () => changeMonth(-1));
document.getElementById("nextMonth").addEventListener("click", () => changeMonth(1));

fetch("results.json?_=" + Date.now())
  .then((res) => {
    if (!res.ok) throw new Error("results.json の読み込みに失敗しました");
    return res.json();
  })
  .then((results) => {
    RESULTS = results;
    AVAILABLE_DATES = Object.keys(results).sort();
    if (AVAILABLE_DATES.length === 0) {
      document.getElementById("status").textContent = "まだデータがありません。";
      renderWeekdayHeader();
      const today = new Date();
      calYear = today.getFullYear();
      calMonth = today.getMonth();
      renderCalendarDays();
      return;
    }
    const latest = AVAILABLE_DATES[AVAILABLE_DATES.length - 1];
    const latestDate = new Date(latest + "T00:00:00+09:00");
    calYear = latestDate.getFullYear();
    calMonth = latestDate.getMonth();

    renderWeekdayHeader();
    renderCalendarDays();
    selectDate(latest);
  })
  .catch((err) => {
    document.getElementById("status").textContent = "エラー: " + err.message;
  });
</script>

</body>
</html>

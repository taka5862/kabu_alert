<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>記事まとめ</title>
<style>
  :root {
    --bg: #f5f6f8;
    --card-bg: #ffffff;
    --text: #1c1f26;
    --muted: #9ca3af;
    --accent: #d81b60;
    --accent-soft: #fbe4ec;
    --border: #e5e7eb;
    --c-impact: #d81b60;
    --c-topic: #f59e0b;
    --c-stop: #dc2626;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  header {
    padding: 8px 10px 4px;
    background: var(--card-bg);
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    z-index: 10;
  }
  .page-nav {
    display: flex;
    gap: 6px;
    margin-bottom: 6px;
  }
  .page-nav a {
    flex: 1;
    text-align: center;
    padding: 6px 0;
    border-radius: 8px;
    font-size: 12px;
    text-decoration: none;
    background: var(--bg);
    color: var(--muted);
    border: 1px solid var(--border);
  }
  .page-nav a.active {
    background: var(--text);
    color: #fff;
    border-color: var(--text);
    font-weight: bold;
  }
  header h1 {
    font-size: 13px;
    margin: 0 0 6px;
    color: var(--muted);
  }

  main {
    padding: 6px 8px 40px;
    max-width: 560px;
    margin: 0 auto;
  }

  /* ---- カレンダー ---- */
  .cal-nav {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 16px;
    margin-bottom: 1px;
  }
  .cal-nav button {
    border: none;
    background: none;
    font-size: 13px;
    color: var(--accent);
    padding: 0 6px;
    cursor: pointer;
    line-height: 1.2;
  }
  .cal-nav button:disabled { color: var(--border); cursor: default; }
  .cal-month-label { font-size: 11px; font-weight: bold; min-width: 70px; text-align: center; }
  .cal-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 1px;
    margin: 0 auto 1px;
    max-width: 240px;
  }
  .cal-weekday { text-align: center; font-size: 8px; color: var(--muted); line-height: 1.1; }
  .cal-day {
    height: 17px; width: 100%;
    display: flex; align-items: center; justify-content: center;
    border-radius: 4px; font-size: 9px; line-height: 1;
    border: none; background: none; color: var(--muted); padding: 0;
  }
  .cal-day.has-data { background: var(--accent-soft); color: var(--text); font-weight: bold; cursor: pointer; }
  .cal-day.selected { background: var(--accent); color: #fff; }
  .cal-day.empty-cell { visibility: hidden; }
  .cal-clear {
    display: block;
    text-align: center;
    font-size: 11px;
    color: var(--accent);
    margin: 4px 0 6px;
    cursor: pointer;
  }

  /* ---- カテゴリタブ ---- */
  #tabs {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 5px;
    margin-bottom: 8px;
  }
  .tab-btn {
    padding: 6px 0;
    border-radius: 7px;
    border: 1px solid var(--border);
    background: var(--card-bg);
    color: var(--text);
    font-size: 11px;
    cursor: pointer;
  }
  .tab-btn.all { grid-column: span 2; }
  .tab-btn.active { color: #fff; font-weight: bold; }
  .tab-btn.active[data-filter="all"] { background: var(--text); border-color: var(--text); }
  .tab-btn.active[data-filter="決算インパクト"] { background: var(--c-impact); border-color: var(--c-impact); }
  .tab-btn.active[data-filter="話題株"] { background: var(--c-topic); border-color: var(--c-topic); }
  .tab-btn.active[data-filter="ストップ高安"] { background: var(--c-stop); border-color: var(--c-stop); }

  /* ---- 記事リスト ---- */
  .item {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-left: 4px solid var(--border);
    border-radius: 8px;
    padding: 8px 10px;
    margin-bottom: 6px;
  }
  .item.決算インパクト { border-left-color: var(--c-impact); }
  .item.話題株 { border-left-color: var(--c-topic); }
  .item.ストップ高安 { border-left-color: var(--c-stop); }
  .item a { color: var(--text); text-decoration: none; font-size: 12px; line-height: 1.35; }
  .item .kind {
    display: inline-block; font-size: 10px; font-weight: bold;
    border-radius: 4px; padding: 1px 5px; margin-right: 5px;
  }
  .item.決算インパクト .kind { color: var(--c-impact); background: #fbe4ec; }
  .item.話題株 .kind { color: var(--c-topic); background: #fef3c7; }
  .item.ストップ高安 .kind { color: var(--c-stop); background: #fee2e2; }
  .item .date-label { font-size: 10px; color: var(--muted); margin-left: 4px; }
  #status { color: var(--muted); font-size: 12px; padding: 16px 0; }
</style>
</head>
<body>

<header>
  <div class="page-nav">
    <a href="index.html">📈 株価</a>
    <a href="articles.html" class="active">📰 記事</a>
  </div>
  <h1>決算インパクト／話題株／ストップ高安（株探）</h1>

  <div class="cal-nav">
    <button id="prevMonth">‹</button>
    <span class="cal-month-label" id="monthLabel"></span>
    <button id="nextMonth">›</button>
  </div>
  <div class="cal-grid" id="calWeekdays"></div>
  <div class="cal-grid" id="calDays"></div>
  <span class="cal-clear" id="clearDate">すべての日付を表示</span>

  <div id="tabs">
    <button class="tab-btn all active" data-filter="all">すべて</button>
    <button class="tab-btn" data-filter="決算インパクト">決算インパクト</button>
    <button class="tab-btn" data-filter="話題株">話題株</button>
    <button class="tab-btn" data-filter="ストップ高安">ストップ高安</button>
  </div>
</header>

<main>
  <div id="status">読み込み中...</div>
  <div id="list"></div>
</main>

<script>
const WEEKDAYS = ["日", "月", "火", "水", "木", "金", "土"];

let ARTICLES = [];
let AVAILABLE_DATES = [];
let selectedDate = null; // nullなら「すべての日付」
let currentFilter = "all";
let calYear, calMonth;

function formatDateLabel(isoDate) {
  const d = new Date(isoDate + "T00:00:00+09:00");
  return `${d.getMonth() + 1}/${d.getDate()}(${WEEKDAYS[d.getDay()]})`;
}

function render() {
  const list = document.getElementById("list");
  list.innerHTML = "";

  let filtered = ARTICLES;
  if (selectedDate) filtered = filtered.filter((a) => a.date === selectedDate);
  if (currentFilter !== "all") filtered = filtered.filter((a) => a.category === currentFilter);

  if (filtered.length === 0) {
    document.getElementById("status").textContent = "該当記事がありません。";
    return;
  }
  document.getElementById("status").textContent = "";

  filtered.forEach((item) => {
    const div = document.createElement("div");
    div.className = "item " + item.category;
    const a = document.createElement("a");
    a.href = item.url;
    a.target = "_blank";
    a.rel = "noopener";
    a.innerHTML = `<span class="kind">${item.category}</span>${item.title}<span class="date-label">${formatDateLabel(item.date)}</span>`;
    div.appendChild(a);
    list.appendChild(div);
  });
}

document.querySelectorAll(".tab-btn").forEach((btn) => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".tab-btn").forEach((b) => b.classList.remove("active"));
    btn.classList.add("active");
    currentFilter = btn.dataset.filter;
    render();
  });
});

function renderWeekdayHeader() {
  const el = document.getElementById("calWeekdays");
  el.innerHTML = "";
  WEEKDAYS.forEach((w) => {
    const div = document.createElement("div");
    div.className = "cal-weekday";
    div.textContent = w;
    el.appendChild(div);
  });
}

function renderCalendarDays() {
  const el = document.getElementById("calDays");
  el.innerHTML = "";
  document.getElementById("monthLabel").textContent = `${calYear}年 ${calMonth + 1}月`;

  const firstDay = new Date(calYear, calMonth, 1);
  const startOffset = firstDay.getDay();
  const daysInMonth = new Date(calYear, calMonth + 1, 0).getDate();

  for (let i = 0; i < startOffset; i++) {
    const empty = document.createElement("div");
    empty.className = "cal-day empty-cell";
    el.appendChild(empty);
  }

  for (let day = 1; day <= daysInMonth; day++) {
    const iso = `${calYear}-${String(calMonth + 1).padStart(2, "0")}-${String(day).padStart(2, "0")}`;
    const btn = document.createElement("button");
    btn.className = "cal-day";
    btn.textContent = day;
    if (AVAILABLE_DATES.includes(iso)) {
      btn.classList.add("has-data");
      btn.addEventListener("click", () => {
        selectedDate = iso;
        renderCalendarDays();
        render();
      });
    }
    if (iso === selectedDate) btn.classList.add("selected");
    el.appendChild(btn);
  }

  const prevBtn = document.getElementById("prevMonth");
  const nextBtn = document.getElementById("nextMonth");
  const monthStr = `${calYear}-${String(calMonth + 1).padStart(2, "0")}`;
  prevBtn.disabled = !AVAILABLE_DATES.some((d) => d < monthStr + "-01");
  nextBtn.disabled = !AVAILABLE_DATES.some((d) => d > monthStr + "-31");
}

function changeMonth(diff) {
  calMonth += diff;
  if (calMonth < 0) { calMonth = 11; calYear -= 1; }
  if (calMonth > 11) { calMonth = 0; calYear += 1; }
  renderCalendarDays();
}

document.getElementById("prevMonth").addEventListener("click", () => changeMonth(-1));
document.getElementById("nextMonth").addEventListener("click", () => changeMonth(1));
document.getElementById("clearDate").addEventListener("click", () => {
  selectedDate = null;
  renderCalendarDays();
  render();
});

fetch("articles.json?_=" + Date.now())
  .then((res) => {
    if (!res.ok) throw new Error("articles.json の読み込みに失敗しました");
    return res.json();
  })
  .then((articles) => {
    ARTICLES = articles;
    AVAILABLE_DATES = [...new Set(articles.map((a) => a.date))].sort();
    renderWeekdayHeader();

    if (AVAILABLE_DATES.length === 0) {
      const today = new Date();
      calYear = today.getFullYear();
      calMonth = today.getMonth();
      renderCalendarDays();
      document.getElementById("status").textContent = "まだデータがありません。";
      return;
    }
    const latest = AVAILABLE_DATES[AVAILABLE_DATES.length - 1];
    const latestDate = new Date(latest + "T00:00:00+09:00");
    calYear = latestDate.getFullYear();
    calMonth = latestDate.getMonth();
    renderCalendarDays();
    render(); // 初期表示は「すべての日付」
  })
  .catch((err) => {
    document.getElementById("status").textContent = "エラー: " + err.message;
  });
</script>

</body>
</html>
